# Prompts on the job — the front door. TLS is the host's (a reverse proxy or
# load balancer in front of port 8080), as on kik-os.cornae.com.
server {
    listen 80;
    client_max_body_size 50m;

    # Static assets: the app's static/ as setup compiled it (no
    # collectstatic). The URL prefix is /assets/, as in kikaron.
    location /assets/ {
        alias /srv/static/;
        expires 7d;
    }

    location /ws/ {
        proxy_pass http://asgi:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
