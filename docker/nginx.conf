# Prompts on the job — the front door. TLS is the host's (a reverse proxy or
# load balancer in front of this port).
server {
    listen 80;
    client_max_body_size 50m;

    # Static assets, as setup gathered them (collectstatic). The URL prefix is
    # /assets/ (kik_os.project.settings STATIC_URL).
    location /assets/ {
        alias /srv/static/;
        expires 7d;
    }

    # The assistant's sockets and everything else: one daphne process.
    location /ws/ {
        proxy_pass http://web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }
}
