# Prompts on the job — one installation: the database, Redis, the app (HTTP
# and WebSockets) and nginx in front. See README.md.
#
#   cp .env.example .env            # and fill it in
#   docker compose --env-file versions.env --env-file .env build \
#       --secret id=github_token,env=GITHUB_TOKEN
#   docker compose --env-file versions.env --env-file .env up -d

x-app: &app
  image: prompts-on-the-job:${KIKARON_REF}-${KIK_PROMPTS_REF}
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      KIKARON_REF: ${KIKARON_REF}
      KIK_PROMPTS_REF: ${KIK_PROMPTS_REF}
    secrets: [github_token]
  env_file: [.env]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_started}
  volumes:
    # setup compiles the CSS (it needs the database) and copies static/ here;
    # nginx serves /assets/ from it. Refreshed on every start of setup, so an
    # upgraded image never serves the previous version's files.
    - static:/srv/static:z
  # On an SELinux host (Fedora, RHEL) podman gives a named volume the private
  # label of the first container that mounts it, so the others could not read
  # it. The containers sharing `static` run unlabelled; elsewhere a no-op.
  security_opt: [label=disable]

services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7

  setup:
    <<: *app
    command: setup
    restart: "no"

  web:
    <<: *app
    command: web
    restart: unless-stopped
    depends_on:
      setup: {condition: service_completed_successfully}

  asgi:
    <<: *app
    command: asgi
    restart: unless-stopped
    depends_on:
      setup: {condition: service_completed_successfully}

  nginx:
    image: docker.io/library/nginx:1.27
    ports: ["8080:80"]
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - static:/srv/static:ro,z
    security_opt: [label=disable]
    depends_on: [web, asgi]
    restart: unless-stopped

secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  db:
  static:
