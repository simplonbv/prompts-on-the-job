# Prompts on the job — one installation: the database, Redis, the app (HTTP
# and WebSockets, one process) and nginx in front. See README.md.
#
#   cp .env.example .env            # and fill it in
#   export GITHUB_TOKEN=...         # private dependency access; see README.md
#   docker compose build
#   docker compose up -d

x-app: &app
  image: prompts-on-the-job:web
  build:
    context: .
    dockerfile: container/Containerfile
    secrets: [github_token]
    target: server
  env_file: .env
  environment:
    KIK_DATABASE_HOST: db
    KIK_REDIS_URL: redis://redis:6379/0
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  volumes:
    # Uploads and the built stylesheet.
    - data:/srv/data:z

services:
  traefik:
    image: traefik:v3.7
    security_opt: [label=disable]
    command:
      # Uncomment this line to enable the traefik dashboard
      # - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:8000"
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - /run/docker.sock:/var/run/docker.sock

  db:
    image: docker.io/library/postgres:19
    environment:
      POSTGRES_DB: ${KIK_DATABASE_NAME}
      POSTGRES_USER: ${KIK_DATABASE_USER}
      POSTGRES_PASSWORD: ${KIK_DATABASE_PASSWORD}
    volumes: [db:/var/lib/postgresql]
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KIK_DATABASE_USER} -d ${KIK_DATABASE_NAME}"]
      interval: 5s
      retries: 20

  redis:
    image: docker.io/library/redis:7
    labels:
      - "traefik.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli pong"]
      interval: 5s
      retries: 5

  assets:
    image: prompts-on-the-job:assets
    build:
      context: .
      dockerfile: container/Containerfile
      secrets: [github_token]
      target: assets
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.assets.rule=PathPrefix(`/assets/`)"
      - "traefik.http.routers.assets.entrypoints=web"
      - "traefik.http.routers.assets.middlewares=addcache"
      - "traefik.http.services.assets.loadbalancer.server.port=80"
      - "traefik.http.middlewares.addcache.headers.customresponseheaders.Cache-Control=public,no-cache,max-age 86400"

  setup:
    <<: *app
    command: setup
    restart: "no"

  server:
    <<: *app
    command: web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server.rule=PathPrefix(`/`)"      
      - "traefik.http.routers.server.entrypoints=web"
      - "traefik.http.services.server.loadbalancer.server.port=8000"
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      db: {condition: service_healthy}


secrets:
  github_token:
    environment: GITHUB_TOKEN

volumes:
  db:
  data:
